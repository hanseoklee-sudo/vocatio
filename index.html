<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocatio</title>
<meta name="description" content="사명에서 오늘까지 이어지는 1D2P 디지털 플래너">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocatio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* Vocatio: quiet paper on a cool desk. One typeface (Pretendard, falling back to the Apple system face),
   one ink-blue accent taken from the app icon, and the icon's red ribbon for "now", Sundays and the bookmark. */
:root{
  --desk:#F5F6F8; --side:#EDEFF3; --paper:#FFFFFF; --paper-2:#F8F9FB; --sunk:#EEF0F4;
  --hover:rgba(22,27,38,.045); --press:rgba(22,27,38,.08); --seg-bg:rgba(22,27,38,.06); --seg-on:#FFFFFF;
  --ink:#161A24; --ink-2:#465064; --ink-3:#61697D; --ink-4:#B3B9C6; --on-ink:#FFFFFF;
  --rule:#E7E9EE; --rule-2:#D8DCE3; --fold:rgba(22,27,38,.035);
  --accent:#3456AA; --accent-2:#284690; --accent-soft:#ECF0FA; --accent-ink:#FFFFFF;
  --ribbon:#C8473F;
  --a:#B5392F; --a-soft:#FBEDEB; --b:#3456AA; --b-soft:#ECF0FA; --c:#5F6779; --c-soft:#EEF0F4;
  --q1:#B5392F; --q1-soft:#FBEDEB; --q2:#1D7552; --q2-soft:#E4F2EA; --q3:#8F5A08; --q3-soft:#FAF0DB;
  --ok:#1D7552; --on-ok:#FFFFFF; --warn:#8F5A08; --bad:#B5392F;
  --event:#EDF1FB; --event-bd:#3456AA; --event-ink:#1F3672;
  --scrim:rgba(16,20,30,.30);
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 1px 2px rgba(16,24,40,.04),0 8px 24px -14px rgba(16,24,40,.16);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06),0 24px 60px -18px rgba(16,24,40,.30);
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --f-serif:var(--f-body); --f-display:var(--f-body);
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:248px; --wrap:1240px; --ease:cubic-bezier(.2,.7,.2,1);
  --r-lg:16px; --r-md:12px; --r-sm:9px;
}
:root[data-mode="dark"],:root[data-theme="dark"]:not([data-mode="light"]){
  --desk:#111317; --side:#0C0E11; --paper:#181B21; --paper-2:#1D2027; --sunk:#242830;
  --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09); --seg-bg:rgba(255,255,255,.07); --seg-on:#363B47;
  --ink:#ECEEF3; --ink-2:#B6BCC9; --ink-3:#8E95A5; --ink-4:#4B5160; --on-ink:#111317;
  --rule:#262A32; --rule-2:#343945; --fold:rgba(0,0,0,.22);
  --accent:#93ABF2; --accent-2:#AFC1F6; --accent-soft:#1E2639; --accent-ink:#0E1220;
  --ribbon:#EE6B60;
  --a:#F08A80; --a-soft:#3A2220; --b:#93ABF2; --b-soft:#1E2639; --c:#AAB1BF; --c-soft:#242830;
  --q1:#F08A80; --q1-soft:#3A2220; --q2:#6FCB9C; --q2-soft:#173026; --q3:#E5B85C; --q3-soft:#332917;
  --ok:#6FCB9C; --on-ok:#0E1A14; --warn:#E5B85C; --bad:#F08A80;
  --event:#1E2639; --event-bd:#93ABF2; --event-ink:#D4DEFB;
  --scrim:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 30px 70px -20px rgba(0,0,0,.85);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --desk:#111317; --side:#0C0E11; --paper:#181B21; --paper-2:#1D2027; --sunk:#242830;
    --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09); --seg-bg:rgba(255,255,255,.07); --seg-on:#363B47;
    --ink:#ECEEF3; --ink-2:#B6BCC9; --ink-3:#8E95A5; --ink-4:#4B5160; --on-ink:#111317;
    --rule:#262A32; --rule-2:#343945; --fold:rgba(0,0,0,.22);
    --accent:#93ABF2; --accent-2:#AFC1F6; --accent-soft:#1E2639; --accent-ink:#0E1220;
    --ribbon:#EE6B60;
    --a:#F08A80; --a-soft:#3A2220; --b:#93ABF2; --b-soft:#1E2639; --c:#AAB1BF; --c-soft:#242830;
    --q1:#F08A80; --q1-soft:#3A2220; --q2:#6FCB9C; --q2-soft:#173026; --q3:#E5B85C; --q3-soft:#332917;
    --ok:#6FCB9C; --on-ok:#0E1A14; --warn:#E5B85C; --bad:#F08A80;
    --event:#1E2639; --event-bd:#93ABF2; --event-ink:#D4DEFB;
    --scrim:rgba(0,0,0,.58);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
    --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 30px 70px -20px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-mode="light"]{color-scheme:light}

/* base */
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--desk)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;font-weight:600;line-height:1.4;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-block:20px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;background:var(--side);border-right:1px solid var(--rule);z-index:60;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:9px;box-shadow:0 1px 2px rgba(16,24,40,.14)}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--ink-3);padding:16px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;min-height:38px;width:100%;text-align:left;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav-i svg{width:18px;height:18px;color:var(--ink-3);transition:color .15s var(--ease)}
.nav-i:hover{background:var(--hover);color:var(--ink)}
.nav-i:active{background:var(--press)}
.nav-i.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px var(--rule)}
.nav-i.on svg{color:var(--accent)}
.nav-n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.nav-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ribbon)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px;border-top:1px solid var(--rule)}
.side-l{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--ink-3);padding:4px 10px 6px}
.seg-theme{display:flex;margin:0 2px 8px}
.seg-theme button{flex:1;justify-content:center;padding:0;min-height:30px}
.sync{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3);padding:6px 10px;width:100%;border-radius:9px;text-align:left;min-height:36px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.sync:hover{background:var(--hover);color:var(--ink-2)}
.sync i,.sync-state i{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none}
.s-ok>i{background:var(--ok)!important}.s-wait>i{background:var(--warn)!important;animation:pulse 1.2s ease-in-out infinite}.s-warn>i{background:var(--bad)!important}.s-local>i{background:var(--ink-4)}
@keyframes pulse{50%{opacity:.35}}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px;padding-left:max(36px,calc((100% - var(--wrap)) / 2 + 36px));padding-right:max(36px,calc((100% - var(--wrap)) / 2 + 36px),env(safe-area-inset-right,0px));background:var(--desk);border-bottom:1px solid var(--rule)}
@supports (backdrop-filter:blur(8px)){.topbar{background:color-mix(in srgb,var(--desk) 78%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}}
.crumb{font-size:13.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{font-weight:600;color:var(--ink);margin-left:2px}
.tb-act{margin-left:auto;display:flex;gap:6px;align-items:center}
.main-in{container-type:inline-size;container-name:main;width:100%;max-width:var(--wrap);margin-inline:auto;padding-block:36px 128px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}
.only-m{display:none}
.tabbar{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:550;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow);transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease),transform .1s var(--ease)}
.btn:hover{background:var(--paper-2);border-color:var(--ink-4)}
.btn:active{background:var(--sunk);transform:translateY(.5px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink);box-shadow:0 1px 2px rgba(16,24,40,.14)}
.btn-primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--paper));border-color:transparent;color:var(--on-ink)}
.btn-primary:active{background:var(--ink);color:var(--on-ink)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);box-shadow:none}
.btn-soft:hover{background:color-mix(in srgb,var(--accent) 15%,var(--paper));border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn-ghost:hover{background:var(--hover);border-color:transparent;color:var(--ink)}
.btn-danger{color:var(--bad)}
.btn-sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);flex:none;box-shadow:var(--shadow);transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-4);background:var(--paper-2)}
.icon-btn:active{background:var(--sunk)}
.icon-btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.icon-btn.ghost:hover{background:var(--hover)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);box-shadow:none}
.icon-btn.soft:hover{background:color-mix(in srgb,var(--accent) 15%,var(--paper))}
.icon-btn.xs{width:26px;height:22px;border:0;background:transparent;color:var(--ink-3);border-radius:6px;box-shadow:none}
.icon-btn.xs:hover{background:var(--hover);color:var(--ink)}
.icon-btn.xs svg{width:15px;height:15px}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--rule-2);border-radius:11px;background:var(--paper);box-shadow:var(--shadow)}
.stepper>.icon-btn,.stepper>.btn{border:0;background:transparent;box-shadow:none;height:32px;min-height:32px;border-radius:8px}
.stepper>.icon-btn{width:32px}
.stepper>.btn{padding:0 10px}
.stepper>.icon-btn:hover,.stepper>.btn:hover{background:var(--hover)}
.link{color:var(--accent);font-size:12.5px;font-weight:600;padding:4px 0;text-decoration:none}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);min-height:30px;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.1),0 0 0 .5px rgba(16,24,40,.06)}
.seg button svg{width:16px;height:16px}
.in{width:100%;border:1px solid var(--rule-2);background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;font-size:14.5px;min-height:40px;line-height:1.5;transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease)}
textarea.in{resize:vertical;display:block}
.in:hover{border-color:var(--ink-4)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.in-sm{min-height:30px;padding:3px 8px;font-size:13px;width:auto;max-width:150px;border-radius:8px}
::placeholder{color:var(--ink-3);opacity:1}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.empty{color:var(--ink-3);font-size:13.5px;margin:10px 0 4px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:6px;line-height:19px}
.badge.bad{color:var(--bad);background:var(--a-soft)}
.badge.ok{color:var(--ok);background:var(--q2-soft)}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);min-height:32px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* view heads */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:28px}
.vhead h1{font-weight:700;font-size:clamp(28px,3vw,34px);line-height:1.2;margin:6px 0 6px;letter-spacing:-.028em;text-wrap:balance}
.vsub{color:var(--ink-3);font-size:14px;margin:0;max-width:62ch;text-wrap:pretty}
.pnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);color:var(--ink);margin-bottom:16px;font-size:14px}
.banner>svg{color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:7px;width:32px;height:32px}
.banner>span:not(.acts){flex:1 1 220px;min-width:0;color:var(--ink-2)}
.banner b{color:var(--ink);font-weight:650}
.banner .acts{margin-left:auto;display:flex;gap:6px}

/* sheets */
.cols{display:grid;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@container main (min-width:900px){
  .cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .cols.cal{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:22px 24px 24px;box-shadow:var(--shadow);min-width:0}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h3,.ph h2{font-weight:700;margin:3px 0 0;line-height:1.3;letter-spacing:-.022em}
.sheet-h h3{font-size:16.5px}
.sheet-sub{font-size:13px;color:var(--ink-3);margin:-8px 0 16px;max-width:60ch}
.add-line{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.add-line .in{flex:1;min-width:180px}

/* day */
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 32px;margin-bottom:30px}
.dtitle{display:flex;align-items:flex-end;gap:16px;margin-top:8px}
.dnum{font-weight:250;font-size:clamp(84px,9vw,112px);line-height:.78;letter-spacing:-.05em;font-variant-numeric:lining-nums tabular-nums;margin-left:-.04em}
.dside{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.dmon{font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.022em}
.ddow{font-size:14px;color:var(--ink-3);font-weight:500}
.ddow.sun{color:var(--ribbon)}
.epi{text-wrap:pretty;margin:24px 0 0;padding:1px 0 1px 14px;border-left:2px solid var(--ribbon);font-size:15.5px;line-height:1.7;color:var(--ink-2);max-width:60ch}
.epi a{color:inherit;text-decoration-color:var(--rule-2)}
.dhead-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fcount{font-size:12px;color:var(--ink-3)}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.spread{display:grid;gap:16px;align-items:start}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:24px 22px 26px;min-width:0;position:relative}
@container main (min-width:900px){
  .spread{grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);gap:0;align-items:stretch;border-radius:18px;box-shadow:var(--shadow-md)}
  .page{box-shadow:none}
  .page.pl{border-radius:18px 0 0 18px;border-right:0;padding:30px 34px 34px 32px;background-image:linear-gradient(to left,var(--fold),transparent 32px)}
  .page.pr{border-radius:0 18px 18px 0;padding:30px 32px 34px 34px;background-image:linear-gradient(to right,var(--fold),transparent 32px)}
  .page.pl::after{content:"";position:absolute;top:-1px;right:24px;width:10px;height:42px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.ph h2{font-size:20px}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.bar{width:80px;height:4px;border-radius:9px;background:var(--sunk);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s var(--ease)}
.compass-mini{margin:0 0 20px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft)}
.compass-mini .eyebrow{color:var(--accent)}
.compass-mini ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink)}
.compass-mini b{font-weight:600;margin-right:8px;color:var(--ink-2)}
.cap-l{font-size:13.5px;color:var(--ink-2);display:block;margin-bottom:10px}
.cap-row{display:flex;gap:8px;align-items:flex-start}
.cap-row textarea{flex:1;resize:none;overflow:hidden;min-height:46px;background:var(--paper-2);border-color:var(--rule);border-radius:12px;padding:11px 14px}
.cap-row textarea:hover{border-color:var(--rule-2)}
.cap-row textarea:focus{background:var(--paper)}
.cap-row .btn{min-height:46px;border-radius:12px;padding:0 16px}
.unsorted{margin-top:18px;border:1px solid color-mix(in srgb,var(--warn) 24%,var(--rule));border-radius:14px;padding:8px 16px 4px;background:color-mix(in srgb,var(--q3-soft) 55%,var(--paper))}
.us-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.us-h b{font-size:14px;font-weight:650}
.us-h b span{font-size:12.5px;color:var(--ink-3);margin-left:6px;font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:14px;height:14px}
.grp{margin-top:26px}
.grp-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.stamp{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:750;font-size:13.5px;line-height:1;flex:none}
.sA{color:var(--a);background:var(--a-soft)}.sB{color:var(--b);background:var(--b-soft)}.sC{color:var(--c);background:var(--c-soft)}
.grp-l{font-weight:650;font-size:14.5px}
.grp-n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp-h .icon-btn{margin-left:auto}
.add-in{padding:10px 0 2px}
.sub-h{font-size:13px;font-weight:650;color:var(--ink-2);margin:26px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--rule)}

.trow{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.sbox{width:22px;height:22px;border:1.5px solid var(--ink-4);border-radius:7px;display:grid;place-items:center;background:var(--paper);color:var(--ink);flex:none;position:relative;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.sbox::after{content:"";position:absolute;inset:-11px}
.sbox svg{width:16px;height:16px}
.sbox:hover{border-color:var(--accent);background:var(--accent-soft)}
.st-done .sbox{color:var(--on-ok);border-color:var(--ok);background:var(--ok)}
.st-cancel .sbox{color:var(--ink-3);border-color:var(--rule-2);background:var(--sunk)}
.st-fwd .sbox{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.st-deleg .sbox,.st-doing .sbox{color:var(--accent);border-color:var(--accent)}
.plabel{font-size:12px;font-weight:700;min-width:22px;flex:none;font-variant-numeric:tabular-nums}
.pA{color:var(--a)}.pB{color:var(--b)}.pC{color:var(--c)}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px 0;text-align:left;border-radius:6px}
.tt{font-size:15px;overflow-wrap:anywhere;line-height:1.45}
.tm{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere;line-height:1.5;margin-top:2px}
.st-done .tt{color:var(--ink-3)}
.st-cancel .tt{text-decoration:line-through;color:var(--ink-3)}
.q{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;flex:none;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.q1{color:var(--q1);background:var(--q1-soft)}.q2{color:var(--q2);background:var(--q2-soft)}.q3{color:var(--q3);background:var(--q3-soft)}
.ro{display:flex;flex-direction:column;flex:none;opacity:.45;transition:opacity .15s}
.trow:hover .ro,.ro:focus-within{opacity:1}
.ghost-row{display:flex;align-items:center;gap:12px;min-height:42px;border-bottom:1px solid var(--rule);color:var(--ink-3);font-size:14px}
.ghost-row .gi{width:22px;height:22px;display:grid;place-items:center;color:var(--warn)}
.ghost-row .gi svg{width:16px;height:16px}
.ghost-row button{text-align:left;flex:1;min-width:0;min-height:40px}

.tl-wrap{max-height:540px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--paper);overscroll-behavior:contain;scrollbar-width:thin}
.tl{position:relative;cursor:cell}
.tl-h{position:absolute;left:0;right:0;height:44px;border-top:1px solid var(--rule)}
.tl-h:first-child{border-top:0}
.tl-h::after{content:"";position:absolute;left:60px;right:0;top:50%;border-top:1px dashed var(--rule);opacity:.7}
.tl-h span{position:absolute;left:12px;top:5px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev{position:absolute;border-radius:8px;background:var(--event);border:0;border-left:3px solid var(--event-bd);color:var(--event-ink);padding:4px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;font-size:12.5px;line-height:1.3;cursor:pointer;z-index:2;transition:filter .15s var(--ease)}
.ev:hover{filter:brightness(.97)}
.ev.open{border-left-style:dashed}
.ev-t{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.ev-n{font-weight:650;overflow-wrap:anywhere}
.tl .now{position:absolute;left:56px;right:0;border-top:2px solid var(--ribbon);pointer-events:none;z-index:1}
.tl .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--ribbon)}
.evl{list-style:none;margin:0;padding:0}
.evl button{display:flex;gap:16px;width:100%;text-align:left;padding:11px 6px;border-bottom:1px solid var(--rule);align-items:baseline;border-radius:6px;transition:background-color .15s var(--ease)}
.evl button:hover{background:var(--hover)}
.evl li:last-child button{border-bottom:0}
.evl .t{font-weight:650;font-size:13px;min-width:50px;color:var(--accent);font-variant-numeric:tabular-nums}
.evl .n{display:flex;flex-direction:column;min-width:0}
.evl .n b{font-weight:600;overflow-wrap:anywhere}
.evl small{color:var(--ink-3);font-size:12px}
.dc{margin-top:24px;padding:14px 16px 10px;border:1px solid var(--rule);border-radius:14px;background:var(--paper-2)}
.dc h3{font-size:15.5px;margin:2px 0 8px}
.dc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--rule)}
.dc-row .m{flex:1;min-width:160px;display:flex;flex-direction:column}
.dc-row small{font-size:12px;color:var(--ink-3)}
.notes-h{margin-top:30px}
.saved{font-size:11.5px;color:var(--ink-3)}
textarea.ruled{--lh:32px;width:100%;min-height:232px;border:0;border-radius:0;background-color:transparent;background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);background-attachment:local;line-height:var(--lh);padding:0 2px;resize:vertical;font-size:15px;display:block}
textarea.ruled:focus{outline:none;background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule-2) calc(var(--lh) - 1px))}
.guide{margin-bottom:20px}
.steps{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:10px;counter-reset:s}
@container main (min-width:760px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--paper-2);border:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.steps li b{font-size:14px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px}
.steps li b::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;flex:none}

/* week */
.roles{display:flex;flex-direction:column;gap:12px}
.role{padding:14px;border-radius:12px;background:var(--paper-2);border:1px solid var(--rule)}
.role-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.role-h b{font-size:14px;font-weight:650}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);min-width:0;min-height:72px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.dchip:hover{border-color:var(--ink-4);background:var(--paper-2)}
.dchip .dw{font-size:11.5px;color:var(--ink-3);font-weight:500}
.dchip .dn{font-size:21px;font-weight:650;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dchip .dcn{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.dchip.today{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dchip.today .dw,.dchip.today .dcn{color:var(--accent-ink);opacity:.8}
.bd{margin-top:8px}
.bd-h{font-size:13px;font-weight:650;color:var(--ink-2);padding:8px 0 2px;min-height:32px}
.bd-h:hover{color:var(--accent)}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--rule);gap:1px}
.mdow{font-size:11.5px;color:var(--ink-3);text-align:center;padding:9px 0 8px;font-weight:600;background:var(--paper)}
.mdow.sun{color:var(--ribbon)}
.mc{position:relative;min-height:104px;padding:6px 6px 8px;background:var(--paper);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:background-color .15s var(--ease)}
.mc:hover{background:var(--paper-2)}
.mc.out{background:var(--paper-2)}
.mc.out .mc-n{color:var(--ink-4)}
.mc-top{display:flex;align-items:center;justify-content:space-between}
.mc-n{font-weight:600;font-size:13.5px;line-height:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.mc-n:hover{background:var(--accent-soft);color:var(--accent)}
.mc.sun .mc-n{color:var(--ribbon)}
.mc.today .mc-n{background:var(--accent);color:var(--accent-ink)}
.mc-add{width:26px;height:26px;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.mc-add svg{width:15px;height:15px}
.mc:hover .mc-add,.mc-add:focus-visible{opacity:1}
.mc-add:hover{background:var(--accent-soft);color:var(--accent)}
@media (hover:none){.mc-add{display:none}}
.mc-it{font-size:11.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.mc-ev{color:var(--event-ink);background:var(--event);border-radius:4px;padding:0 5px;border-left:2px solid var(--event-bd)}
.mc-dl{color:var(--accent)}
.mc-dots{display:none;gap:3px;margin-top:auto;justify-content:center}
.mc-dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-4)}
.mc-dots i.e{background:var(--event-bd)}.mc-dots i.d{background:var(--accent)}
@container main (max-width:640px){
  .mc{min-height:60px;padding:4px 2px;align-items:center}
  .mc-top{justify-content:center}
  .mc-it,.mc-add{display:none}
  .mc-dots{display:flex}
  .dchip .dcn{display:none}
}
.scroll-list{max-height:400px;overflow-y:auto;scrollbar-width:thin}

/* year */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ym{display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--paper);text-align:left;min-height:108px;min-width:0;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.ym:hover{border-color:var(--ink-4);background:var(--paper-2)}
.ym.now{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ym b{font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-.022em}
.ym.now b{color:var(--accent)}
.ym span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ym em{font-style:normal;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objl{list-style:none;margin:0;padding:0}
.objl li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.objl li:last-child{border-bottom:0}
.objl .k{font-size:11.5px;font-weight:650;color:var(--accent);min-width:78px}
.objl .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* projects */
.pgrid{display:grid;gap:20px;align-items:start}
@container main (min-width:900px){.pgrid{grid-template-columns:1fr 1fr}}
.proj-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2)}
.pct{font-size:26px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s var(--ease)}
.proj.done .pbar i{background:var(--ok)}
.padd{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.padd .in{flex:1;min-width:160px}
.padd input[type=date]{flex:0 0 auto;width:auto}

/* delegated & lists */
.dg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule)}
.dg-row .m{flex:1;min-width:200px;display:flex;flex-direction:column}
.dg-row .m button{text-align:left;font-weight:550;font-size:15px;min-height:28px}
.dg-row small{font-size:12px;color:var(--ink-3)}
.dg-acts{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.stat{padding:12px 14px;border-radius:12px;background:var(--paper-2);border:1px solid var(--rule)}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.qbar{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--sunk);margin:10px 0 8px;gap:2px}
.qbar i{display:block;height:100%}
.qbar .b1{background:var(--q1)}.qbar .b2{background:var(--q2)}.qbar .b3{background:var(--q3)}
.qleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.qleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:currentColor}
.rq{margin-bottom:18px}
.rq label{display:block;font-weight:650;font-size:15px;margin-bottom:2px}
.rq p{margin:0 0 8px;font-size:12.5px;color:var(--ink-3)}
.rq textarea{font-size:15px;line-height:1.7}
.log-d{font-size:12.5px;font-weight:650;color:var(--ink-2);margin:14px 0 2px}
.log-i{font-size:14px;padding:4px 0 4px 22px;position:relative;color:var(--ink)}
.log-i::before{content:"✓";position:absolute;left:2px;color:var(--ok);font-size:12px}
.nres{display:block;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid var(--rule);border-radius:6px;transition:background-color .15s var(--ease)}
.nres:hover{background:var(--hover)}
.nres:last-child{border-bottom:0}
.nres .d{font-size:12.5px;font-weight:650;color:var(--accent)}
.nres .s{display:block;font-size:14.5px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--q3-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.tr-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule)}
.tr-row:first-child{border-top:0}
.tr-row .m{flex:1;min-width:180px;display:flex;flex-direction:column}
.tr-row small{font-size:12px;color:var(--ink-3)}

/* mos */
.mos-sec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px}
.mos-k{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:19px;font-weight:800;line-height:1}
.mos-q{font-size:17px;font-weight:700;margin:7px 0 12px;letter-spacing:-.022em}
.mos-m{min-height:150px;font-size:15.5px;line-height:1.8}
.orow{display:flex;align-items:center;gap:8px;padding:5px 0}
.okey{font-size:12px;font-weight:700;color:var(--accent);min-width:36px;font-variant-numeric:tabular-nums}
.orow .in{flex:1}
.ocount{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.sblock{padding:14px 0;border-top:1px solid var(--rule)}
.sblock:first-of-type{border-top:0}
.sblock h4{margin:0 0 8px;font-size:14px;font-weight:650;display:flex;gap:8px}
.srow{padding-left:24px}
.cascade{display:flex;flex-direction:column;gap:20px}
.draftline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--ink-3);margin:-10px 0 20px}
.chipline{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--rule);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:500;color:var(--ink-2)}
.ver{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule)}
.ver .m{flex:1;min-width:160px}
.ver b{font-size:14px;font-weight:650}
.ver small{display:block;font-size:12px;color:var(--ink-3)}

/* fab, toast, modal */
.fab{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 16px;border-radius:24px;background:var(--ink);color:var(--on-ink);font-weight:600;box-shadow:var(--shadow-lg);font-size:14px;transition:transform .2s var(--ease),background-color .15s var(--ease)}
.fab:hover{background:color-mix(in srgb,var(--ink) 84%,var(--paper))}
.fab:active{transform:scale(.97)}
.fab svg{width:18px;height:18px}
.fab .n{background:var(--ribbon);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:20px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
#toast-root{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:12px;font-size:13.5px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);animation:rise .22s var(--ease)}
.toast button{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:28px}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.mback{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .16s ease}
@supports (backdrop-filter:blur(2px)){.mback{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}}
@keyframes fade{from{opacity:0}}

<script>
(function(){
'use strict';
document.documentElement.lang='ko';

/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1,12);};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d);};
const todayS=()=>ymd(new Date());
const monOf=s=>{const d=P(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const mKey=s=>s.slice(0,7);
const monthAdd=(mk,n)=>{let[y,m]=mk.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return `${y}-${pad(m)}`;};
const DOW=['일','월','화','수','목','금','토'];
const md=s=>{const d=P(s);return `${d.getMonth()+1}.${d.getDate()}`;};
const mdw=s=>`${md(s)} ${DOW[P(s).getDay()]}`;
const longD=s=>{const d=P(s);return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;};
const dim=(y,m)=>new Date(y,m,0).getDate();
const daysBetween=(a,b)=>Math.round((P(b)-P(a))/864e5);
const doy=s=>{const d=P(s);return daysBetween(`${d.getFullYear()}-01-01`,s)+1;};
const diy=y=>((y%4===0&&y%100!==0)||y%400===0)?366:365;
const isoWeek=s=>{const d0=P(s);const d=new Date(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-ys)/864e5+1)/7);};
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0);};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const fmtAt=ms=>{const d=new Date(ms);return `${d.getMonth()+1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const dday=s=>{const n=daysBetween(todayS(),s);return n===0?'D-DAY':n>0?`D-${n}`:`D+${-n}`;};
const short=(s,n=18)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;};
function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(typeof c[ks[i]]!=='object'||c[ks[i]]===null)c[ks[i]]={};c=c[ks[i]];}c[ks[ks.length-1]]=v;}
const HH=44;

/* ================= icons ================= */
const sv=(p,w=18)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={

  trash:sv('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/>'),
  search:sv('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'),
  pdf:sv('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>'),
  sun:sv('<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/>'),
  moon:sv('<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>'),
  monitor:sv('<rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/>'),
  clock:sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  l:sv('<path d="M14.5 6l-6 6 6 6"/>'),
  r:sv('<path d="M9.5 6l6 6-6 6"/>'),
  x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  menu:sv('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  inbox:sv('<path d="M3.5 13.5l2.6-7.2a1.5 1.5 0 0 1 1.4-1h9a1.5 1.5 0 0 1 1.4 1l2.6 7.2V18a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 18z"/><path d="M3.5 13.5h4.8l1.2 2.2h5l1.2-2.2h4.8"/>'),
  gear:sv('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  up:sv('<path d="M6.5 14.5L12 9l5.5 5.5"/>'),
  down:sv('<path d="M6.5 9.5L12 15l5.5-5.5"/>'),
  fwd:sv('<path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5"/>'),
};
const ss=p=>`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SI={todo:'',doing:ss('<circle cx="10" cy="10" r="3.2" fill="currentColor" stroke="none"/>'),done:ss('<path d="M4.5 10.5l3.6 3.4L15.5 6"/>'),cancel:ss('<path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/>'),deleg:ss('<circle cx="10" cy="10" r="5.4"/>'),fwd:ss('<path d="M3.5 10h11.5M11 6l4 4-4 4"/>')};
const ST={todo:{l:'미시작'},doing:{l:'진행 중'},done:{l:'완료'},cancel:{l:'취소'},deleg:{l:'위임'},fwd:{l:'연기'}};
const TR={personal:'Personal · 개인',pastoral:'Pastoral · 목회'};
const TRS={personal:'Personal',pastoral:'Pastoral'};
const GL={A:'반드시 오늘 해야 할 일',B:'하면 좋은 일',C:'여유가 생기면'};
const QH={1:'긴급하고 중요한 일 · 위기, 마감, 오늘의 급한 일',2:'중요하지만 긴급하지 않은 일 · 준비, 관계, 계획, 영성',3:'긴급하지만 중요하지 않은 일 · 줄이거나 맡길 일'};
const CATS=['아이디어','받은 요청','할 일','일정','메모'];
const DEF_ROLES=[{id:'r1',name:'개인 · 영성'},{id:'r2',name:'가정 · 관계'},{id:'r3',name:'목회 · 사역'},{id:'r4',name:'몸 · 안식'}];
const MARK=`<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="mk-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3456AA"/><stop offset="1" stop-color="#233F86"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#mk-g)"/><path d="M8.2 13.3c5.2-2.3 9.4-1.9 11.4.4v15.1c-2-2.3-6.2-2.6-11.4-.6z" fill="#FDFCFA"/><path d="M31.8 13.3c-5.2-2.3-9.4-1.9-11.4.4v15.1c2-2.3 6.2-2.6 11.4-.6z" fill="#FDFCFA" fill-opacity=".86"/><path d="M23.4 12.6v10.3l1.4-1.2 1.4 1.2V12.2z" fill="#C8473F"/></svg>`;

/* ================= state ================= */
const S={docs:{}};
const K=(k,id)=>k+':'+id;
const list=k=>{const out=[],p=k+':';for(const key in S.docs){if(key.startsWith(p))out.push(S.docs[key]);}return out;};
const get=(k,id)=>S.docs[K(k,id)];
function put(k,id,body){body.id=body.id??id;body.updated=Date.now();S.docs[K(k,id)]=body;changed(K(k,id));}
function drop(k,id){delete S.docs[K(k,id)];Q.tomb[K(k,id)]=Date.now();changed(K(k,id));}

const U={view:'day',date:todayS(),wk:monOf(todayS()),mk:mKey(todayS()),yr:Number(todayS().slice(0,4)),
  rvTab:'w',rvWk:monOf(todayS()),rvMk:mKey(todayS()),dTab:'wait',projF:'active',noteQ:'',
  sched:'grid',theme:'system',guideHidden:false,mosTrack:'personal',addIn:null,modal:null,drawer:false,tlFor:null,rvDismissed:false};
const UI_KEY='vocatio.ui.v1', LS_KEY='vocatio.data.v1';
function loadUI(){try{const o=JSON.parse(localStorage.getItem(UI_KEY)||'{}');['sched','theme','guideHidden','mosTrack','projF','installHidden','syncHidden'].forEach(k=>{if(o[k]!==undefined)U[k]=o[k];});}catch(_){}}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify({sched:U.sched,theme:U.theme,guideHidden:U.guideHidden,mosTrack:U.mosTrack,projF:U.projF,installHidden:U.installHidden,syncHidden:U.syncHidden}));}catch(_){}}

/* ================= storage & sync ================= */
/* Every record is one document keyed "kind:id". Records live in localStorage on each device,
   and sync to the owner's own Google Sheet through a small Apps Script web app (Code.gs). */
const Q={dirty:new Set(),tomb:{}};
const SY={url:'',key:'',busy:false,again:false,status:'off',err:'',last:0,rev:0,timer:null,cal:null,calNow:false};
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(_){return '';}})();
const SY_KEY='vocatio.sync.v1';
let lsT=null,lsWarned=false;
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(o&&o.docs){S.docs=o.docs;(o.unsynced||[]).forEach(k=>Q.dirty.add(k));Q.tomb=o.tomb||{};}}catch(_){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({docs:S.docs,unsynced:[...Q.dirty],tomb:Q.tomb}));lsWarned=false;}catch(_){if(!lsWarned){lsWarned=true;toast('이 기기의 저장 공간이 부족합니다. 휴지통을 비우거나 백업한 뒤 정리해 주세요.');}}}
function saveLocalSoon(){clearTimeout(lsT);lsT=setTimeout(saveLocal,300);}
function changed(key){saveLocalSoon();Q.dirty.add(key);scheduleSync(2500);syncUI();}
function loadSync(){try{const o=JSON.parse(localStorage.getItem(SY_KEY)||'null');if(o){SY.url=o.url||'';SY.key=o.key||'';SY.rev=Number(o.rev)||0;SY.last=Number(o.last)||0;SY.cal=o.cal||null;}}catch(_){}}
function saveSync(){try{localStorage.setItem(SY_KEY,JSON.stringify({url:SY.url,key:SY.key,rev:SY.rev,last:SY.last,cal:SY.cal}));}catch(_){}}
const syncOn=()=>!!(SY.url&&SY.key);
function scheduleSync(ms){if(!syncOn())return;clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,ms);}
async function syncNow(){
  if(!syncOn())return;
  if(SY.busy){SY.again=true;return;}
  clearTimeout(SY.timer);
  if(navigator.onLine===false){SY.status='offline';syncUI();return;}
  SY.busy=true;SY.status='syncing';syncUI();
  const keys=[...Q.dirty].slice(0,400),sent={},calNow=SY.calNow;SY.calNow=false;
  const push=keys.map(k=>{const b=S.docs[k];sent[k]=JSON.stringify(b??null);return{key:k,body:b===undefined?null:b,u:b===undefined?(Q.tomb[k]||Date.now()):(b.updated||Date.now())};});
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
    const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:SY.key,op:'sync',since:SY.rev,push,tz:TZ,cal:calNow?'now':undefined}),signal:ctl.signal});
    clearTimeout(to);
    let j=null;try{j=await r.json();}catch(_){throw{code:'not_json'};}
    if(!j||!j.ok)throw{code:(j&&j.error)||'server'};
    keys.forEach(k=>{if(JSON.stringify(S.docs[k]??null)===sent[k]){Q.dirty.delete(k);delete Q.tomb[k];}});
    const big=j.tooLarge||[];big.forEach(k=>Q.dirty.delete(k));
    if(big.length)toast('너무 긴 항목이 있어 일부를 동기화하지 못했습니다. 이 기기에는 그대로 남아 있습니다.');
    let ch=false;
    for(const d of (j.docs||[])){
      if(!d||typeof d.key!=='string'||Q.dirty.has(d.key))continue;
      if(d.body==null){if(d.key in S.docs){delete S.docs[d.key];ch=true;}}
      else if(!same(S.docs[d.key],d.body)){S.docs[d.key]=d.body;ch=true;}
    }
    SY.cal=j.cal||null;if(j.cal&&j.cal.more){SY.calNow=true;SY.again=true;}
    SY.rev=Number(j.rev)||SY.rev;SY.last=Date.now();SY.status='ok';SY.err='';saveSync();saveLocal();
    if(ch)render();
  }catch(e){SY.status=navigator.onLine===false?'offline':'error';SY.err=(e&&e.code)||(e&&e.name==='AbortError'?'timeout':'network');}
  SY.busy=false;syncUI();
  if(U.modal&&U.modal.type==='settings')renderModal();
  if(SY.again||(SY.status==='ok'&&Q.dirty.size)){SY.again=false;scheduleSync(400);}
  else if(SY.status!=='ok'&&Q.dirty.size&&SY.err!=='bad_key')scheduleSync(20000);
}
function initSync(){loadSync();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(_){}if(syncOn())syncNow();else syncUI();}
const rel=ms=>{if(!ms)return '';const s=Math.round((Date.now()-ms)/1000);if(s<60)return '방금';const m=Math.round(s/60);if(m<60)return m+'분 전';const h=Math.round(m/60);if(h<24)return h+'시간 전';return fmtAt(ms);};
function syncState(){
  if(!syncOn())return['local','이 기기에만 저장 · 동기화 미연결'];
  if(SY.status==='syncing')return['wait','동기화 중…'];
  if(SY.status==='offline')return['warn','오프라인 · 이 기기에 저장됨'];
  if(SY.status==='error')return['warn',SY.err==='bad_key'?'동기화 키가 맞지 않습니다':'동기화 실패 · 잠시 뒤 다시 시도'];
  if(Q.dirty.size)return['wait','저장 대기 중…'];
  if(SY.status==='ok')return['ok','동기화 완료 · '+rel(SY.last)];
  return['wait','동기화 준비 중…'];
}
function syncUI(){const el=$('#sync');if(!el)return;const[s,l]=syncState();el.className='sync s-'+s;el.innerHTML=`<i></i><span>${l}</span>`;}
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(_){return false;}};
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isSafari=/^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(U.view==='day')render();});
function connCode(){return 'VOC1.'+btoa(JSON.stringify({u:SY.url,k:SY.key})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function parseCode(s){const b=s.trim().slice(5).replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(b+'='.repeat((4-b.length%4)%4)));}
async function saveFile(blob,name){
  let file=null;try{file=new File([blob],name,{type:blob.type||'application/octet-stream'});}catch(_){}
  if(file&&isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return 'shared';}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return 'saved';
}

/* ================= model helpers ================= */
const tasks=()=>list('task').filter(t=>!t.deleted);
const events=()=>list('event').filter(e=>!e.deleted);
const evSort=(a,b)=>((a.date||'')+(a.start||'')).localeCompare((b.date||'')+(b.start||''));
const isAD=e=>!!(e.allDay||e.endDate);
const eventsOn=d=>events().filter(e=>e.date===d||(e.endDate&&e.date<d&&d<=e.endDate)).sort(evSort);
function evTime(e){if(e.endDate)return `${md(e.date)}${e.allDay?'':' '+e.start} – ${md(e.endDate)}${e.allDay||!e.end?'':' '+e.end}`;if(e.allDay)return '하루 종일';return `${e.start}${e.end?'–'+e.end:''}`;}
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const PRI={A:0,B:1,C:2};
const byPri=(a,b)=>(PRI[a.pri]??3)-(PRI[b.pri]??3)||byOrder(a,b);
function prefs(){const p=get('prefs','main')||{};return{roles:(p.roles&&p.roles.length)?p.roles:DEF_ROLES};}
function mosDoc(tr){return get('mos',tr)||{id:tr,mission:'',objectives:[],strategies:[]};}
function mosEnsure(tr){let d=get('mos',tr);if(!d){d={id:tr,mission:'',objectives:[],strategies:[]};}d.objectives=d.objectives||[];d.strategies=d.strategies||[];return d;}
function allObjectives(){return['personal','pastoral'].flatMap(tr=>(mosDoc(tr).objectives||[]).map((o,i)=>({...o,track:tr,idx:i})));}
function objById(id){return allObjectives().find(o=>o.id===id);}
function newTask(f){const t={id:uid(),title:'',status:'todo',q:null,pri:null,order:Date.now(),date:null,track:null,yearLink:null,monthLink:null,weekLink:null,projectId:null,dependsOn:null,objId:null,delegate:null,note:'',history:[],created:Date.now(),...f};put('task',t.id,t);return t;}
function saveTask(t){put('task',t.id,t);}
function groupMax(date,pri){return Math.max(0,...tasks().filter(x=>x.date===date&&x.pri===pri).map(x=>x.order||0));}
function setStatus(t,s,ex={}){
  const from=t.status;t.history=t.history||[];const at=Date.now();
  if(s==='fwd'){t.history.push({at,type:'fwd',fromDate:t.date,toDate:ex.date});t.date=ex.date;if(t.status!=='doing')t.status='todo';}
  else if(s==='deleg'){t.delegate={to:ex.to,confirm:ex.confirm,resolved:false,at};t.status='deleg';t.history.push({at,type:'deleg',to:ex.to,confirm:ex.confirm});}
  else{
    if(from==='deleg'&&t.delegate&&!t.delegate.resolved){t.delegate.resolved=true;t.delegate.withdrawn=true;t.delegate.resolvedAt=at;}
    t.status=s;t.history.push({at,type:'status',from,to:s});if(s==='done')t.doneAt=at;
  }
  saveTask(t);
}
const delegWaiting=()=>tasks().filter(t=>t.status==='deleg'&&t.delegate&&!t.delegate.resolved);
const delegHistory=()=>tasks().filter(t=>t.delegate&&t.delegate.resolved).sort((a,b)=>(b.delegate.resolvedAt||0)-(a.delegate.resolvedAt||0));
const inboxItems=()=>list('inbox').filter(x=>!x.deleted);
function trashItems(){return['task','event','proj','inbox'].flatMap(k=>list(k).filter(x=>x.deleted).map(x=>({k,x}))).sort((a,b)=>(b.x.deletedAt||0)-(a.x.deletedAt||0));}
function purgeOld(){const lim=Date.now()-30*864e5;trashItems().forEach(({k,x})=>{if((x.deletedAt||0)<lim)drop(k,x.id);});}
function missionLine(){for(const tr of['personal','pastoral']){const m=(get('mos',tr)||{}).mission||'';const line=m.split(/\n+/).map(s=>s.trim()).find(Boolean);if(line){const mm=line.match(/^.*?[.!?。](\s|$)/);const s=mm?mm[0].trim():line;return s.length>150?s.slice(0,148)+'…':s;}}return '';}
function reviewFilled(id){const r=get('review',id);return !!(r&&((r.q1||'').trim()||(r.q2||'').trim()||(r.q3||'').trim()));}
function reviewDue(){
  const t=todayS(),dow=P(t).getDay();let w=null,m=null;
  if(dow===6||dow===0)w=monOf(t);else if(dow===1)w=addD(monOf(t),-7);
  if(w&&reviewFilled('w'+w))w=null;
  const d=P(t).getDate(),nd=dim(P(t).getFullYear(),P(t).getMonth()+1);
  if(d>=nd-1)m=mKey(t);else if(d<=3)m=monthAdd(mKey(t),-1);
  if(m&&reviewFilled('m'+m))m=null;
  return{w,m};
}
function periodStats(from,to){
  const all=tasks();
  const ts=all.filter(t=>t.date&&t.date>=from&&t.date<=to);
  const fwd=all.filter(t=>(t.history||[]).some(h=>h.type==='fwd'&&h.fromDate>=from&&h.fromDate<=to)).length;
  const done=ts.filter(t=>t.status==='done').length,open=ts.filter(t=>t.status==='todo'||t.status==='doing').length;
  const deleg=ts.filter(t=>t.delegate&&!t.delegate.withdrawn).length,cancel=ts.filter(t=>t.status==='cancel').length;
  const qs=ts.filter(t=>t.q&&t.status!=='cancel');const q={1:0,2:0,3:0};qs.forEach(t=>{q[t.q]=(q[t.q]||0)+1;});
  return{ts,done,open,deleg,cancel,fwd,q,qn:qs.length};
}

function layoutEvents(evs){
  const arr=evs.map(e=>{const s=mins(e.start)??0;return{e,s,en:e.end?Math.max(mins(e.end),s+15):s+60};}).sort((a,b)=>a.s-b.s||b.en-a.en);
  const out=[];let cl=[],cEnd=-1;
  const flush=()=>{const ends=[];for(const it of cl){let l=ends.findIndex(x=>x<=it.s);if(l<0){l=ends.length;ends.push(it.en);}else ends[l]=it.en;it.lane=l;}for(const it of cl)out.push({e:it.e,s:it.s,en:it.en,lane:it.lane,lanes:ends.length});cl=[];};
  for(const it of arr){if(cl.length&&it.s>=cEnd){flush();cEnd=-1;}cl.push(it);cEnd=Math.max(cEnd,it.en);}
  if(cl.length)flush();
  return out;
}
function timelineHTML(d,evs){
  const ad=evs.filter(isAD);evs=evs.filter(e=>!isAD(e));
  let h='';for(let i=0;i<24;i++)h+=`<div class="tl-h" style="top:${i*HH}px"><span>${pad(i)}:00</span></div>`;
  const ev=layoutEvents(evs).map(({e,s,en,lane,lanes})=>{const top=s/60*HH+1,ht=Math.max((en-s)/60*HH-3,24);
    return `<button class="ev ${e.end?'':'open'}" data-act="edit-event" data-id="${e.id}" ${e.rec?'':`data-drag="${e.id}"`} style="top:${top}px;height:${ht}px;left:calc(60px + (100% - 66px) * ${lane}/${lanes});width:calc((100% - 66px) / ${lanes} - 3px)"><span class="ev-t mono">${esc(e.start)}${e.end?'–'+esc(e.end):' ◇'}</span><span class="ev-n">${e.rec?I.rep:''}${esc(e.title)}</span>${e.rec?'':'<span class="ev-grip" aria-hidden="true"></span>'}</button>`;}).join('');
  const now=d===todayS()?`<div class="now" id="tl-now" style="top:${nowMin()/60*HH}px"></div>`:'';
  return `${ad.length?`<div class="allday" aria-label="하루 종일 일정">${ad.map(e=>`<button class="ad-ev" data-act="edit-event" data-id="${e.id}"><span class="ev-t">${esc(evTime(e))}</span><span class="ev-n">${e.rec?I.rep:''}${esc(e.title)}</span></button>`).join('')}</div>`:''}<div class="tl-wrap" id="tl-scroll"><div class="tl" data-tl="${d}" data-date="${d}" style="height:${24*HH}px">${h}${ev}${now}${U.tlSel&&U.tlSel.date===d?selHTML(U.tlSel.s,U.tlSel.e):''}</div></div><p class="hint">${COARSE?'빈 시간대를 누르면 한 시간 일정이 생기고, 길게 누른 채 끌면 원하는 길이로 만듭니다. 일정은 길게 눌러 옮기고, 아래 끝을 길게 눌러 길이를 바꿉니다.':'빈 시간대를 끌어 시간을 정하면 일정이 생기고, 한 번 누르면 한 시간짜리가 생깁니다. 일정은 끌어서 옮기고, 아래 끝을 끌어 길이를 바꿉니다.'} ◇는 종료 시간 미정입니다.</p>`;
}

function viewWeek(){
  const mon=U.wk,sun=addD(mon,6),days=[...Array(7)].map((_,i)=>addD(mon,i)),T=todayS();
  const w=get('week',mon)||{},roles=prefs().roles,all=tasks();
  const rocks=all.filter(t=>t.weekLink===mon).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')||byOrder(a,b));
  const rid=new Set(rocks.map(t=>t.id));

function snapFocus(){const a=document.activeElement;if(!a||!a.id||a===document.body)return null;let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd;}catch(_){}return{id:a.id,s,e};}
function restoreFocus(f){if(!f)return;const el=document.getElementById(f.id);if(!el||el===document.activeElement)return;try{el.focus({preventScroll:true});if(f.s!=null&&el.setSelectionRange)el.setSelectionRange(f.s,f.e);}catch(_){}}

/* ================= toast ================= */
function toast(msg,label,fn){
  const root=$('#toast-root'),el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${esc(msg)}</span>`;
  if(label&&fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();el.remove();};el.appendChild(b);}
  root.appendChild(el);while(root.children.length>3)root.firstChild.remove();
  setTimeout(()=>el.remove(),label?6000:3200);
}

function closeModal(){const had=!!U.tlSel;U.tlSel=null;U.modal=null;renderModal(false);if(had)$$('.tl .tl-sel').forEach(x=>x.remove());}
function renderModal(keep){
  const root=$('#modal-root');
  if(!U.modal||!MODALS[U.modal.type]){root.innerHTML='';document.body.classList.remove('locked');return;}
  const f=keep!==false?snapFocus():null;
  const html=MODALS[U.modal.type]();
  if(!U.modal){root.innerHTML='';document.body.classList.remove('locked');return;}
  const sc=root.querySelector('.modal');const st=sc?sc.scrollTop:0;
  root.innerHTML=`<div class="mback${U.modal.type==='tlnew'?' pop-back':''}" data-act="close-modal-bg">${html}</div>`;document.body.classList.add('locked');
  const mo=root.querySelector('.modal');if(mo&&!U.modal._new)mo.scrollTop=st;
  root.querySelectorAll('textarea.auto').forEach(autosize);
  if(U.modal._new){U.modal._new=false;const af=root.querySelector('[data-autofocus]');if(af){try{af.focus({preventScroll:true});}catch(_){}}else if(mo){mo.setAttribute('tabindex','-1');mo.focus({preventScroll:true});}}
  else restoreFocus(f);
  if(U.modal.type==='pdf')scalePreview();
  if(U.modal.type==='tlnew')placePop();
}

function pdfPages(m){

async function exportPDF(){
  const m=U.modal;if(!m||m.busy)return;
  const setMsg=t=>{m.msg=t;const el=$('#pdf-msg');if(el)el.textContent=t;};
  m.busy=true;m.ready=false;m.blob=null;renderModal();setMsg('PDF 도구를 준비하는 중…');
  const host=$('#pdf-host');
  try{
    if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    host.innerHTML=pdfPages(m).join('');
    try{await document.fonts.ready;}catch(_){}
    await new Promise(r=>setTimeout(r,250));
    const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
    const pages=[...host.children];
    for(let i=0;i<pages.length;i++){
      setMsg(`${i+1} / ${pages.length}쪽 그리는 중…`);
      const c=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,width:1123,height:794,windowWidth:1123});
      if(i)pdf.addPage('a4','landscape');
      pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,297,210);
    }
    host.innerHTML='';
    const KN={day:'일간',week:'주간',month:'월간',year:'연간'};
    const tag=m.kind==='month'?m.fromM:m.kind==='year'?String(m.fromY):m.kind==='week'?monOf(m.from):m.from;
    m.fname=`Vocatio_${KN[m.kind]}_${tag}.pdf`;m.blob=pdf.output('blob');m.ready=true;
    m.msg=`${pages.length}쪽 PDF가 준비되었습니다. ‘PDF 저장’을 누르세요.`;
  }catch(e){
    host.innerHTML='';
    m.msg=e&&e.code==='load'?'PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.':'PDF를 만들지 못했습니다. 다시 시도해 주세요.';
  }
  if(U.modal===m){m.busy=false;renderModal();}
}

function addLines(text,extra){const lines=String(text||'').split(/\r?\n/).map(s=>s.replace(/^\s*([-*•·▪︎]|\d+[.)]|\[\s?\])\s+/,'').trim()).filter(Boolean);const base=Date.now();lines.forEach((l,i)=>newTask({title:l,order:base+i,...extra}));return lines.length;}

function reorder(id,dir){

}
function triNext(){
  const m=U.modal;if(!m||m.type!=='triage'){render();return;}
  m.q=null;m.idx++;
  while(m.idx<m.ids.length){const t=get('task',m.ids[m.idx]);if(t&&!t.deleted&&!t.pri&&t.status!=='deleg'&&t.status!=='cancel'&&t.date===m.date)break;m.idx++;}
  if(m.idx>=m.ids.length){U.modal=null;render();toast('정리를 마쳤습니다.');return;}
  render();
}

const APP_VER='11.11-c';
const SNAP=15;
const COARSE=(()=>{try{return matchMedia('(hover: none) and (pointer: coarse)').matches;}catch(_){return false;}})();
const TL={g:null,pend:null,tp:null,raf:0,pending:false,suppress:false};
const hm=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return `${pad(Math.floor(m/60))}:${pad(m%60)}`;};
const durLabel=m=>m<60?`${m}분`:`${Math.floor(m/60)}시간${m%60?' '+(m%60)+'분':''}`;
const tlMin=(tl,y)=>{const r=tl.getBoundingClientRect();return Math.max(0,Math.min(1440,(y-r.top)/HH*60));};
function selHTML(s,e){return `<div class="tl-sel${e-s<45?' short':''}" style="top:${s/60*HH}px;height:${Math.max((e-s)/60*HH-2,9)}px"><span class="sel-t">${hm(s)} – ${hm(e)}</span><span class="sel-d">${durLabel(e-s)}</span></div>`;}
function flushRender(){if(TL.pending){TL.pending=false;render();}}
function tlStart(kind,tl,y,ev){
  const g={kind,tl,wrap:tl.closest('.tl-wrap'),date:tl.dataset.tl,y0:y,y,moved:false};
  if(kind==='new'){g.a=Math.floor(tlMin(tl,y)/SNAP)*SNAP;const w=document.createElement('div');tl.appendChild(w);g.el=w;}
  else{const e=get('event',ev.dataset.drag);if(!e)return false;g.id=e.id;g.e0=clone(e);g.s0=mins(e.start)||0;g.en0=e.end?Math.max(mins(e.end),g.s0+SNAP):g.s0+60;g.el=ev;g.lab=ev.querySelector('.ev-t');g.m0=tlMin(tl,y);ev.classList.add('dragging');}
  TL.g=g;document.body.classList.add('tl-dragging');if(kind==='size')document.body.classList.add('tl-size');
  tlUpdate();if(!TL.raf)TL.raf=requestAnimationFrame(tlLoop);return true;
}
function tlUpdate(){
  const g=TL.g;if(!g)return;const m=tlMin(g.tl,g.y);
  if(g.kind==='new'){const c=Math.floor(m/SNAP)*SNAP;g.s=Math.min(g.a,c);g.e=Math.min(Math.max(g.a,c)+SNAP,1440);
    const n=document.createElement('div');n.innerHTML=selHTML(g.s,g.e);const fresh=n.firstChild;g.el.replaceWith(fresh);g.el=fresh;return;}
  if(g.kind==='move'){const dur=g.en0-g.s0,d=Math.round((m-g.m0)/SNAP)*SNAP;g.s=Math.max(0,Math.min(1440-dur,g.s0+d));g.e=g.s+dur;g.el.style.top=(g.s/60*HH+1)+'px';}
  else{g.s=g.s0;g.e=Math.max(g.s0+SNAP,Math.min(1440,Math.round(m/SNAP)*SNAP));g.el.style.height=Math.max((g.e-g.s)/60*HH-3,24)+'px';}
  if(g.lab)g.lab.textContent=`${hm(g.s)}${(g.kind==='move'&&!g.e0.end)?' ◇':'–'+hm(g.e)}`;
}
function tlLoop(){
  const g=TL.g;if(!g){TL.raf=0;return;}
  if(g.wrap){const r=g.wrap.getBoundingClientRect(),edge=36;let v=0;
    if(g.y<r.top+edge)v=-(r.top+edge-g.y)/3;else if(g.y>r.bottom-edge)v=(g.y-(r.bottom-edge))/3;
    if(v){const before=g.wrap.scrollTop;g.wrap.scrollTop+=Math.max(-16,Math.min(16,v));if(g.wrap.scrollTop!==before)tlUpdate();}}
  TL.raf=requestAnimationFrame(tlLoop);
}
function tlEnd(cancel){
  const g=TL.g;TL.g=null;cancelAnimationFrame(TL.raf);TL.raf=0;document.body.classList.remove('tl-dragging','tl-size');
  if(!g){flushRender();return;}
  if(g.kind==='new'){
    g.el.remove();if(cancel){flushRender();return;}
    if(!g.moved){const m=Math.min(Math.floor(tlMin(g.tl,g.y0)/30)*30,1380);g.s=m;g.e=m+60;}
    TL.pending=false;U.tlSel={date:g.date,s:g.s,e:g.e};render();
    openModal({type:'tlnew',date:g.date,s:g.s,e:g.e,title:'',st:hm(g.s),et:hm(g.e)});return;
  }
  g.el.classList.remove('dragging');
  if(cancel||!g.moved||(g.s===g.s0&&g.e===g.en0)){TL.pending=false;render();return;}
  TL.suppress=true;setTimeout(()=>{TL.suppress=false;},450);
  const e=get('event',g.id);if(!e){render();return;}
  const prev=clone(g.e0),end=(g.kind==='move'&&!g.e0.end)?null:hm(g.e);
  put('event',g.id,{...e,start:hm(g.s),end});TL.pending=false;render();
  toast(g.kind==='move'?`${hm(g.s)}(으)로 옮겼습니다.`:`${hm(g.s)}–${end}(으)로 바꿨습니다.`,'되돌리기',()=>{put('event',g.id,prev);render();});
}
function tlHover(e){
  let h=$('.tl .tl-hov');const tl=e.target.closest&&e.target.closest('.tl[data-tl]');
  if(!tl||U.modal||e.target.closest('.ev,.tl-sel')){if(h)h.hidden=true;return;}
  if(!h||h.parentNode!==tl){if(h)h.remove();h=document.createElement('div');h.className='tl-hov';h.setAttribute('aria-hidden','true');tl.appendChild(h);}
  const m=Math.min(Math.floor(tlMin(tl,e.clientY)/30)*30,1410);h.style.top=(m/60*HH+1)+'px';h.style.height=(HH/2-2)+'px';h.textContent='+ '+hm(m);h.hidden=false;
}
function placePop(){
  const mo=$('#modal-root .modal.pop'),sel=$('.tl .tl-sel');if(!mo)return;
  if(innerWidth<=640||!sel){mo.style.left=mo.style.top='';
    if(sel&&innerWidth<=640){const w=sel.closest('.tl-wrap'),r=sel.getBoundingClientRect(),wr=w.getBoundingClientRect();if(r.top<wr.top||r.bottom>wr.top+wr.height*.55)w.scrollTop+=r.top-wr.top-24;}
    return;}
  const r=sel.getBoundingClientRect(),w=mo.offsetWidth,h=mo.offsetHeight,gap=14,vw=innerWidth,vh=innerHeight;
  let left,top;
  if(r.left-gap-w>=16)left=r.left-gap-w;else if(r.right+gap+w<=vw-16)left=r.right+gap;
  if(left!=null)top=Math.max(16,Math.min(vh-h-16,r.top-8));
  else{left=Math.max(16,Math.min(vw-w-16,r.left+(r.width-w)/2));top=r.bottom+gap+h<=vh-16?r.bottom+gap:Math.max(16,r.top-gap-h);}
  mo.style.left=left+'px';mo.style.top=top+'px';
}
function tnSync(){
  const m=U.modal;if(!m||m.type!=='tlnew')return;const s=mins(m.st),e=mins(m.et);if(s==null||e==null||e<=s)return;
  m.s=s;m.e=e;U.tlSel={date:m.date,s,e};const g=$('.tl .tl-sel');if(g)g.outerHTML=selHTML(s,e);
  const h=$('#m-title');if(h)h.textContent=`${hm(s)} – ${hm(e)}`;const sub=$('#modal-root .modal.pop .m-sub');if(sub)sub.textContent=`${longD(m.date)} · ${durLabel(e-s)}`;placePop();
}
// mouse and pen
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0||TL.g)return;
  const tl=e.target.closest('.tl[data-tl]');if(!tl)return;
  const ev=e.target.closest('.ev');
  if(ev){if(ev.dataset.drag)TL.pend={kind:e.target.closest('.ev-grip')?'size':'move',tl,ev,x:e.clientX,y:e.clientY};return;}
  e.preventDefault();tlStart('new',tl,e.clientY);
});
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  if(TL.pend&&!TL.g){const p=TL.pend;if(Math.abs(e.clientY-p.y)<5&&Math.abs(e.clientX-p.x)<5)return;TL.pend=null;if(!tlStart(p.kind,p.tl,p.y,p.ev))return;TL.g.moved=true;}
  const g=TL.g;if(!g){tlHover(e);return;}
  g.y=e.clientY;if(Math.abs(g.y-g.y0)>3)g.moved=true;tlUpdate();
});
document.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;TL.pend=null;if(TL.g)tlEnd(false);});
document.addEventListener('pointercancel',e=>{if(e.pointerType==='touch')return;TL.pend=null;if(TL.g)tlEnd(true);});
document.addEventListener('pointerdown',()=>{TL.suppress=false;},true);
document.addEventListener('click',e=>{if(TL.suppress){TL.suppress=false;e.preventDefault();e.stopPropagation();}},true);
// touch: tap makes an hour, long-press then drag makes any length; long-press an event to move it, near its bottom to resize
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||TL.g){if(TL.tp){clearTimeout(TL.tp.timer);TL.tp=null;}return;}
  const tl=e.target.closest&&e.target.closest('.tl[data-tl]');if(!tl)return;
  const t=e.touches[0],ev=e.target.closest('.ev');if(ev&&!ev.dataset.drag)return;
  const kind=ev?(t.clientY>ev.getBoundingClientRect().bottom-16?'size':'move'):'new';
  const p={kind,tl,ev,x:t.clientX,y:t.clientY};
  p.timer=setTimeout(()=>{if(TL.tp!==p)return;if(tlStart(p.kind,p.tl,p.y,p.ev)&&p.kind!=='new')TL.g.moved=true;},320);
  TL.tp=p;
},{passive:true});
document.addEventListener('touchmove',e=>{
  const p=TL.tp;if(!p)return;const t=e.touches[0];
  if(!TL.g){if(Math.abs(t.clientY-p.y)>8||Math.abs(t.clientX-p.x)>8){clearTimeout(p.timer);TL.tp=null;}return;}
  e.preventDefault();TL.g.y=t.clientY;if(Math.abs(TL.g.y-TL.g.y0)>3)TL.g.moved=true;tlUpdate();
},{passive:false});
document.addEventListener('touchend',e=>{
  const p=TL.tp;if(!p)return;clearTimeout(p.timer);TL.tp=null;
  if(TL.g){e.preventDefault();tlEnd(false);return;}
  if(p.kind==='new'){e.preventDefault();if(tlStart('new',p.tl,p.y))tlEnd(false);}
},{passive:false});
document.addEventListener('touchcancel',()=>{const p=TL.tp;if(p)clearTimeout(p.timer);TL.tp=null;if(TL.g)tlEnd(true);});
addEventListener('resize',()=>{if(U.modal&&U.modal.type==='tlnew')placePop();});
document.addEventListener('click',e=>{
  if(e.target.closest('.side a'))U.drawer=false;
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  fn(el,e);
});
const savedT={};
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){
    const[k,id,path]=t.dataset.bind.split('|');const cur=get(k,id)||{id};setPath(cur,path,t.value);put(k,id,cur);
    const h=document.querySelector(`[data-saved="${t.id}"]`)||(t.id.startsWith('rv-')?document.querySelector('[data-saved^="rv-"]'):null);
    if(h){h.textContent='저장 중…';clearTimeout(savedT[t.id]);savedT[t.id]=setTimeout(()=>{h.textContent='저장됨';},900);}
  }
  if(t.dataset.draft&&U.modal&&U.modal.draft){U.modal.draft[t.dataset.draft]=t.type==='checkbox'?t.checked:t.value;}
  if(t.dataset.mfield&&U.modal){U.modal[t.dataset.mfield]=t.value;if(t.dataset.rerender)renderModal();if(t.id==='tn-st'||t.id==='tn-et')tnSync();}
  if(t.dataset.mos){const[kind,tr,id]=t.dataset.mos.split('|');const d=mosEnsure(tr);const arr=kind==='obj'?d.objectives:d.strategies;const it=arr.find(x=>x.id===id);if(it){it.text=t.value;put('mos',tr,d);}}
  if(t.dataset.roleid&&U.modal&&U.modal.roles){const r=U.modal.roles.find(x=>x.id===t.dataset.roleid);if(r)r.name=t.value;}
  if(t.dataset.tasktitle){const x=get('task',t.dataset.tasktitle);if(x&&t.value.trim()){x.title=t.value;saveTask(x);}}
  if(t.id==='note-q'){U.noteQ=t.value;render();}
  if(t.classList.contains('auto'))autosize(t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pick-day'&&t.value){goDay(t.value);return;}
  if(t.id==='ev-allday'&&U.modal&&U.modal.draft){U.modal.draft.allDay=t.checked;renderModal();return;}
  if(t.dataset.change==='rock-day'){const x=get('task',t.dataset.id);if(x){x.date=t.value||null;saveTask(x);render();}return;}
  if(t.dataset.rerenderChange&&U.modal){U.modal[t.dataset.mfield]=t.value;U.modal.msg='';U.modal.ready=false;U.modal.blob=null;renderModal();return;}
  if(t.id==='imp-file'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{let o=null;try{o=JSON.parse(fr.result);}catch(_){}
      if(!o||o.app!=='vocatio'||!o.docs||typeof o.docs!=='object'){toast('Vocatio 백업 파일이 아닙니다.');return;}
      const keys=Object.keys(o.docs).filter(k=>/^[a-z]+:[A-Za-z0-9_.~:@+-]+$/.test(k)&&o.docs[k]&&typeof o.docs[k]==='object');
      ask('백업 가져오기',`${keys.length}개 항목을 지금 기록에 합칩니다. 같은 항목은 가져온 내용으로 바뀝니다.`,'가져오기',()=>{keys.forEach(k=>{S.docs[k]=o.docs[k];changed(k);});toast(`${keys.length}개 항목을 가져왔습니다.`);});};
    fr.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(U.modal){closeModal();return;}if(U.drawer){A['close-drawer']();return;}if(U.addIn){U.addIn=null;render();return;}}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){
    const t=e.target;
    if(t.id==='cap-day'){e.preventDefault();addCaptured();return;}
    if(t.dataset&&t.dataset.addgroup){e.preventDefault();addToGroup(t.dataset.addgroup,t.value);return;}
    if(t.dataset&&t.dataset.enter&&ENTER[t.dataset.enter]){e.preventDefault();ENTER[t.dataset.enter](t);return;}
    if(t.id==='qa-title'){e.preventDefault();A['quick-save']();return;}
    if(t.id==='tn-title'){e.preventDefault();A['tn-save']();return;}
    if(t.id==='ev-title'){e.preventDefault();A['ev-save']();return;}
    if(t.id==='dg-to'){e.preventDefault();A['deleg-go']();return;}
  }
});
document.addEventListener('paste',e=>{
  const t=e.target;if(t.id!=='cap-day')return;
  const txt=(e.clipboardData||window.clipboardData)?.getData('text')||'';
  if(!/\n/.test(txt.trim()))return;
  e.preventDefault();const n=addLines((t.value?t.value+'\n':'')+txt,{date:U.date});t.value='';render();toast(`${n}개를 추가했습니다.`);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();if(syncOn()&&Q.dirty.size)syncNow();}else if(syncOn())syncNow();});
window.addEventListener('online',()=>{if(syncOn())syncNow();});
window.addEventListener('offline',()=>{if(syncOn()){SY.status='offline';syncUI();}});
window.addEventListener('pagehide',saveLocal);
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{if(U.modal&&U.modal.type==='pdf')scalePreview();});
let lastDay=todayS();
setInterval(()=>{
  if(U.theme==='time')applyTheme();
  syncUI();if(!document.hidden&&syncOn()&&!SY.busy)syncNow();
  const n=$('#tl-now');if(n)n.style.top=(nowMin()/60*HH)+'px';
  const T=todayS();if(T!==lastDay){if(U.date===lastDay)U.date=T;lastDay=T;U.rvDismissed=false;if(!U.modal&&!(document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)))render();}
},60000);

/* ================= boot ================= */
loadUI();loadLocal();applyTheme();purgeOld();
U.view=ROUTES.includes(location.hash.slice(1))?location.hash.slice(1):'day';
render();
initSync();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
